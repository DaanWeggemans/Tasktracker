name: CI + build only

on:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Haal de code op
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. .NET instellen
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Dependencies herstellen
      - name: Restore dependencies
        run: dotnet restore

      # 4. Project bouwen
      - name: Build project
        run: dotnet build --no-restore --configuration Release

      # 5. Tests draaien (CI) + output naar bestand
      - name: Run tests
        run: |
          mkdir -p test-results
          dotnet test --no-build --configuration Release --logger "junit;LogFilePath=../test-results/junit.xml"

      # 6. Upload testresultaten als artifact
      - name: Upload test results
        if: always() # ook uploaden als tests falen
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
